
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dubai Taste Hub</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#fff8f0;color:#222}
header{background:#211b18;color:white;text-align:center;padding:25px}
header h1{color:#ffad70}
nav{text-align:center;background:white;padding:12px;position:sticky;top:0}
button{background:#ed7029;color:white;border:0;padding:11px 15px;border-radius:8px;cursor:pointer;margin:4px}
main{max-width:1100px;margin:auto;padding:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.card,.panel{background:white;border-radius:12px;padding:12px;box-shadow:0 2px 10px #0001;margin-bottom:15px}
.card img{width:100%;height:160px;object-fit:cover;border-radius:9px}
.price{font-weight:bold;color:#d65b19}
input,textarea,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:7px}
.green{background:#16834b}
.red{background:#b52c2c}
#admin{display:none}
.cartline{padding:10px;border-bottom:1px solid #ddd}
footer{text-align:center;padding:25px}
</style>
</head>
<body>
<header>
<h1>🍔 Dubai Taste Hub</h1>
<p>Fresh Food • Fast Delivery • Great Taste</p>
</header>
<nav>
<button onclick="go('menu')">Food Menu</button>
<button onclick="go('cartSection')">My Cart</button>
<button onclick="openAdmin()">Admin Panel</button>
</nav>
<main>
<h2>Our Food Menu</h2>
<div id="menu" class="grid"></div>
<section id="cartSection" class="panel">
<h2>🛒 Shopping Cart</h2>
<div id="cartItems">Cart is empty</div>
<h3>Total: AED <span id="total">0.00</span></h3>
<h3>Delivery Details</h3>
<input id="customer" placeholder="Your Name">
<input id="phone" placeholder="Phone Number">
<textarea id="address" placeholder="Delivery Address"></textarea>
<select id="payment">
<option>Cash on Delivery</option>
<option>Card on Delivery</option>
</select>
<button class="green" onclick="placeOrder()">Order on WhatsApp</button>
</section>
<section id="admin" class="panel">
<h2>Admin Panel</h2>
<input id="dishName" placeholder="Food Name">
<input id="dishPrice" type="number" min="0" placeholder="Price AED">
<input id="dishImage" placeholder="Image URL">
<button onclick="addDish()">Add Food</button>
<h3>Manage Menu</h3>
<div id="manage"></div>
<button class="red" onclick="closeAdmin()">Close Admin</button>
</section>
</main>
<footer>Dubai Taste Hub © 2026</footer>
<script>
const ADMIN_PIN="2611";
const WHATSAPP_NUMBER="971508254302";
const defaults=[
{id:1,name:"Chicken Burger",price:20,image:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600"},
{id:2,name:"Cheese Pizza",price:35,image:"https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600"},
{id:3,name:"Fried Chicken",price:25,image:"https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=600"},
{id:4,name:"Chicken Shawarma",price:18,image:"https://images.unsplash.com/photo-1529006557810-274b9b2fc783?w=600"},
{id:5,name:"Biryani",price:28,image:"https://images.unsplash.com/photo-1563379091339-03246963d96c?w=600"},
{id:6,name:"Club Sandwich",price:18,image:"https://images.unsplash.com/photo-1553909489-cd47e0ef937f?w=600"}
];
let foods;
try{foods=JSON.parse(localStorage.getItem("dth_foods"))||defaults}
catch(e){foods=defaults}
let cart={};

function go(id){
document.getElementById(id).scrollIntoView({behavior:"smooth"});
}
function safe(value){
return String(value).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}
function save(){
localStorage.setItem("dth_foods",JSON.stringify(foods));
render();
}
function render(){
document.getElementById("menu").innerHTML=foods.map(f=>`
<div class="card">
<img src="${safe(f.image)}" alt="${safe(f.name)}" onerror="this.src='https://placehold.co/600x400?text=Food'">
<h3>${safe(f.name)}</h3>
<p class="price">AED ${Number(f.price).toFixed(2)}</p>
<button onclick="addCart(${f.id})">Add to Cart</button>
</div>`).join("");

let totalPrice=0;
let rows=[];
Object.keys(cart).forEach(id=>{
let f=foods.find(x=>x.id==id);
if(!f)return;
let sub=f.price*cart[id];
totalPrice+=sub;
rows.push(`<div class="cartline">
${safe(f.name)} × ${cart[id]} = AED ${sub.toFixed(2)}
<button onclick="quantity(${id},-1)">−</button>
<button onclick="quantity(${id},1)">+</button>
<button class="red" onclick="removeItem(${id})">Remove</button>
</div>`);
});
document.getElementById("cartItems").innerHTML=rows.length?rows.join(""):"Cart is empty";
document.getElementById("total").innerText=totalPrice.toFixed(2);
document.getElementById("manage").innerHTML=foods.map(f=>`
<div class="cartline">
<b>${safe(f.name)}</b> - AED ${f.price}
<button onclick="editFood(${f.id})">Edit</button>
<button class="red" onclick="deleteFood(${f.id})">Delete</button>
</div>`).join("");
}
function addCart(id){
cart[id]=(cart[id]||0)+1;
render();
}
function quantity(id,n){
cart[id]=(cart[id]||0)+n;
if(cart[id]<=0)delete cart[id];
render();
}
function removeItem(id){
delete cart[id];
render();
}
function addDish(){
let name=document.getElementById("dishName").value.trim();
let rawPrice=document.getElementById("dishPrice").value;
let price=Number(rawPrice);
let image=document.getElementById("dishImage").value.trim();
if(!name||rawPrice===""||!Number.isFinite(price)||price<0){
alert("Enter a food name and valid price");
return;
}
foods.push({id:Date.now(),name,price,image:image||"https://placehold.co/600x400?text=Food"});
save();
document.getElementById("dishName").value="";
document.getElementById("dishPrice").value="";
document.getElementById("dishImage").value="";
}
function editFood(id){
let f=foods.find(x=>x.id===id);
let name=prompt("Food name",f.name);
if(name===null)return;
let priceText=prompt("New price AED",f.price);
if(priceText===null)return;
let price=Number(priceText);
if(!name.trim()||priceText.trim()===""||!Number.isFinite(price)||price<0){
alert("Invalid name or price");
return;
}
f.name=name.trim();
f.price=price;
save();
}
function deleteFood(id){
if(!confirm("Delete this food?"))return;
foods=foods.filter(f=>f.id!==id);
delete cart[id];
save();
}
function openAdmin(){
let pin=prompt("Enter Admin PIN");
if(pin!==ADMIN_PIN){
alert("Wrong PIN");
return;
}
document.getElementById("admin").style.display="block";
go("admin");
}
function closeAdmin(){
document.getElementById("admin").style.display="none";
}
function placeOrder(){
let customer=document.getElementById("customer").value.trim();
let phone=document.getElementById("phone").value.trim();
let address=document.getElementById("address").value.trim();
let payment=document.getElementById("payment").value;
let ids=Object.keys(cart);
if(ids.length===0){alert("Your cart is empty");return}
if(!customer||!phone||!address){
alert("Please enter your name, phone and address");
return;
}
let total=0;
let lines=ids.map(id=>{
let f=foods.find(x=>x.id==id);
if(!f)return "";
let sub=f.price*cart[id];
total+=sub;
return f.name+" x "+cart[id]+" = AED "+sub.toFixed(2);
}).filter(Boolean);
let message=
"NEW FOOD ORDER - Dubai Taste Hub\n\n"+
"Customer: "+customer+"\n"+
"Phone: "+phone+"\n"+
"Address: "+address+"\n"+
"Payment: "+payment+"\n\n"+
lines.join("\n")+
"\n\nTOTAL: AED "+total.toFixed(2);
window.open("https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(message),"_blank");
}
render();
</script>
</body>
</html>
